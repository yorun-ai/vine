apiVersion: v1
kind: Service
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: vine-portal
    app.kubernetes.io/component: portal
spec:
  # Change to ClusterIP when an Ingress controller terminates/exposes traffic.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: vine-portal
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
    - name: dashboard
      port: 7099
      targetPort: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: vine-portal
    app.kubernetes.io/component: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vine-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vine-portal
        app.kubernetes.io/component: portal
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-hub
          image: ghcr.io/yorun-ai/vine/vine-portal:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z hub 7071; do
                echo "waiting for Hub Control API at hub:7071"
                sleep 2
              done
      containers:
        - name: portal
          image: ghcr.io/yorun-ai/vine/vine-portal:latest
          imagePullPolicy: Always
          env:
            - name: VINE_HUB_ENDPOINT
              value: http://hub:7071
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: dashboard
              containerPort: 7099
          startupProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
