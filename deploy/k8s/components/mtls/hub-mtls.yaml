apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hub
spec:
  template:
    spec:
      volumes:
        - name: mtls
          secret:
            secretName: vine-hub-mtls
            defaultMode: 0440
      containers:
        - name: hub
          env:
            - name: VINE_MTLS_CA_FILE
              value: /run/vine/mtls/ca.pem
            - name: VINE_MTLS_CERT_FILE
              value: /run/vine/mtls/cert.pem
            - name: VINE_MTLS_KEY_FILE
              value: /run/vine/mtls/key.pem
          volumeMounts:
            - name: mtls
              mountPath: /run/vine/mtls
              readOnly: true
