apiVersion: v1
kind: Service
metadata:
  name: link
  labels:
    app.kubernetes.io/name: vine-link
    app.kubernetes.io/component: link
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vine-link
  ports:
    - name: api
      port: 7079
      targetPort: api
    - name: ingress
      port: 7082
      targetPort: ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: link
  labels:
    app.kubernetes.io/name: vine-link
    app.kubernetes.io/component: link
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vine-link
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vine-link
        app.kubernetes.io/component: link
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-hub
          image: ghcr.io/yorun-ai/vine-link
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z hub 7071; do
                echo "waiting for Hub Control API at hub:7071"
                sleep 2
              done
      containers:
        - name: link
          image: ghcr.io/yorun-ai/vine-link
          imagePullPolicy: IfNotPresent
          env:
            - name: VINE_HUB_ENDPOINT
              value: http://hub:7071
            - name: VINE_API_LISTEN
              value: 0.0.0.0:7079
            - name: VINE_INGRESS_LISTEN
              value: 0.0.0.0:7082
          ports:
            - name: api
              containerPort: 7079
            - name: ingress
              containerPort: 7082
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
