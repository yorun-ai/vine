name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.x'
  BUILD_GO_VERSION: '1.27.1'

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go-test: ${{ steps.changes.outputs['go-test'] }}
      go-static: ${{ steps.changes.outputs['go-static'] }}
      go-race: ${{ steps.changes.outputs['go-race'] }}
      licenses: ${{ steps.changes.outputs['licenses'] }}
      dashboard: ${{ steps.changes.outputs['dashboard'] }}
      container: ${{ steps.changes.outputs['container'] }}
      workflow: ${{ steps.changes.outputs['workflow'] }}
      k8s: ${{ steps.changes.outputs['k8s'] }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci.sh changes

  go-test:
    name: Go test
    needs: changes
    if: needs.changes.outputs['go-test'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Test
        run: bash test/test.sh

      - name: Test goroutine lifecycles
        run: bash test/goroutineleak.sh

  go-static:
    name: Go static
    needs: changes
    if: needs.changes.outputs['go-static'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Vet
        run: GOWORK=off go vet ./...

      - name: Check module files
        run: GOWORK=off go mod tidy -diff

  go-race:
    name: Go race
    needs: changes
    if: needs.changes.outputs['go-race'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            test/race.sh

      - name: Test with race detector
        run: bash test/race.sh

  security:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --no-banner .

  licenses:
    name: Third-party licenses
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: Check third-party licenses
        run: |
          bash script/gen-third-party-licenses.sh
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt

  k8s:
    name: Kubernetes manifests
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install manifest tools
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-bin"
          GOBIN="$RUNNER_TEMP/k8s-bin" GOWORK=off go install github.com/mikefarah/yq/v4@v4.53.6
          GOBIN="$RUNNER_TEMP/k8s-bin" GOWORK=off go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          echo "$RUNNER_TEMP/k8s-bin" >> "$GITHUB_PATH"
      - name: Validate manifests
        run: bash test/k8s.sh

  dashboard:
    name: Dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: internal/daemon/hub/src/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: internal/daemon/hub/src/dashboard/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  container:
    name: Build hub image
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          target: hub
          platforms: linux/amd64
          push: false
          build-args: |
            GO_VERSION=${{ env.BUILD_GO_VERSION }}
            VERSION=v0.0.0-dev
          cache-from: type=gha,scope=vine-hub

  workflow:
    name: Workflow checks
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Lint workflows
        run: GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test CI and release policy
        run: |
          shellcheck .github/scripts/*.sh test/*.sh
          for script in script/*.sh; do bash -n "$script"; done
          bash .github/scripts/ci_test.sh
          bash .github/scripts/release_test.sh
      - name: Prepare detached release metadata fixture
        run: |
          git checkout --detach HEAD
          git tag "ci-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Exercise release metadata action without publishing
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/vine-hub
          flavor: latest=false
          tags: type=raw,value=ci-check
      - name: Verify metadata revision
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          echo "$METADATA" | jq -e --arg sha "$(git rev-parse HEAD)" '.labels["org.opencontainers.image.revision"] == $sha'

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [changes, go-test, go-static, go-race, security, licenses, dashboard, container, workflow, k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci.sh verify
