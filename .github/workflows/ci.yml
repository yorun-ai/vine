name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.x'
  BUILD_GO_VERSION: '1.27.1'

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go-test: ${{ steps.changes.outputs['go-test'] }}
      go-static: ${{ steps.changes.outputs['go-static'] }}
      go-race: ${{ steps.changes.outputs['go-race'] }}
      licenses: ${{ steps.changes.outputs['licenses'] }}
      dashboard: ${{ steps.changes.outputs['dashboard'] }}
      container: ${{ steps.changes.outputs['container'] }}
      workflow: ${{ steps.changes.outputs['workflow'] }}
      k8s: ${{ steps.changes.outputs['k8s'] }}
      release-policy: ${{ steps.changes.outputs['release-policy'] }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci.sh changes

  go-test:
    name: Go test
    needs: changes
    if: needs.changes.outputs['go-test'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Test
        run: bash test/test.sh

      - name: Test goroutine lifecycles
        run: bash test/goroutineleak.sh

  go-checks:
    name: Go checks
    needs: changes
    if: needs.changes.outputs['go-static'] == 'true' || needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Vet
        if: needs.changes.outputs['go-static'] == 'true'
        run: GOWORK=off go vet ./...

      - name: Check module files
        if: needs.changes.outputs['go-static'] == 'true'
        run: GOWORK=off go mod tidy -diff

      - name: Check third-party licenses
        if: needs.changes.outputs.licenses == 'true'
        run: |
          bash script/gen-third-party-licenses.sh
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt

  go-race:
    name: Go race
    needs: changes
    if: needs.changes.outputs['go-race'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            test/race.sh

      - name: Test with race detector
        run: bash test/race.sh

  security:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --no-banner .

  k8s:
    name: Kubernetes manifests
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    uses: ./.github/workflows/ci-k8s.yml
    with:
      go-version: '1.27.x'

  dashboard:
    name: Dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    uses: ./.github/workflows/ci-dashboard.yml

  container:
    name: Build hub image
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: hub
          platforms: linux/amd64
          push: false
          build-args: |
            GO_VERSION=${{ env.BUILD_GO_VERSION }}
            VERSION=v0.0.0-dev
          cache-from: type=gha,scope=vine-hub

  workflow:
    name: Workflow checks
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Lint workflows
        run: GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test CI policy
        run: |
          shellcheck .github/scripts/*.sh test/*.sh
          for script in script/*.sh; do bash -n "$script"; done
          bash .github/scripts/ci_test.sh
      - name: Test release policy
        if: needs.changes.outputs['release-policy'] == 'true'
        run: bash .github/scripts/release_test.sh
      - name: Prepare detached release metadata fixture
        if: needs.changes.outputs['release-policy'] == 'true'
        run: |
          git checkout --detach HEAD
          git tag "ci-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Exercise release metadata action without publishing
        if: needs.changes.outputs['release-policy'] == 'true'
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/vine-hub
          flavor: latest=false
          tags: type=raw,value=ci-check
      - name: Verify metadata revision
        if: needs.changes.outputs['release-policy'] == 'true'
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          echo "$METADATA" | jq -e --arg sha "$(git rev-parse HEAD)" '.labels["org.opencontainers.image.revision"] == $sha'

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [changes, go-test, go-checks, go-race, security, dashboard, container, workflow, k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci.sh verify
