name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build and publish
        required: true
        type: string
      artifacts:
        description: Artifacts to publish (existing binary assets are never overwritten)
        type: choice
        options: [all, binaries, images]
        default: all
  release:
    types: [published]

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  ARTIFACTS: ${{ inputs.artifacts || 'all' }}
  GOWORK: 'off'

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: source
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      binaries: ${{ steps.release.outputs.binaries }}
      images: ${{ steps.release.outputs.images }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: automation
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source

      - name: Validate release
        id: release
        run: bash ../automation/.github/scripts/release.sh validate
        env:
          GH_TOKEN: ${{ github.token }}

  binaries:
    name: Release binaries
    needs: validate
    if: needs.validate.outputs.binaries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: automation
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
          path: source

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: source/go.sum

      - name: Build archives
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          revision="$(git rev-parse HEAD)"
          git tag --points-at HEAD --list "$RELEASE_TAG" | grep -Fx "$RELEASE_TAG"
          ldflags="-s -w -X go.yorun.ai/vine/buildinfo.ldModuleVersion=$RELEASE_TAG"
          mkdir -p dist

          for target in \
            darwin/amd64 \
            darwin/arm64 \
            linux/amd64 \
            linux/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="vine_${version}_${goos}_${goarch}"
            stage="dist/$archive"

            if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
              echo "Release builds require a clean Git working tree"
              exit 1
            fi
            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              GOMODCACHE="$RUNNER_TEMP/go-mod" \
              go build -trimpath -ldflags "$ldflags" \
                -o "$stage/vine" ./cmd/vine
            go version -m "$stage/vine" | tee "$RUNNER_TEMP/vine-build-info.txt"
            source ../automation/.github/scripts/release.sh
            require_binary_metadata "$RELEASE_TAG" "$revision" < "$RUNNER_TEMP/vine-build-info.txt"
            cp LICENSE README.md THIRD_PARTY_LICENSES.txt "$stage/"
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          done

          "dist/vine_${version}_linux_amd64/vine" version --json |
            grep -F "\"version\":\"$RELEASE_TAG\""

      - name: Create checksums
        run: |
          cd dist
          sha256sum vine_*.tar.gz > checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ../automation/.github/scripts/release.sh preflight-binaries
          gh release upload "$RELEASE_TAG" \
            dist/vine_*.tar.gz \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY"

  images:
    name: Publish ${{ matrix.target }} image
    needs: validate
    if: needs.validate.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [hub, link, portal]
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check version image
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/release.sh image-build-needed

      - name: Check out release
        if: steps.existing.outputs.build == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Git-context metadata needs the tag refs, even when checking out a SHA.
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up QEMU
        if: steps.existing.outputs.build == 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        if: steps.existing.outputs.build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.existing.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.existing.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # A manual rebuild runs from a branch, but metadata must use the release commit.
          context: git
          images: ghcr.io/${{ github.repository_owner }}/vine-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,prefix=sha-

      - name: Build and publish image
        if: steps.existing.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=vine-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=vine-${{ matrix.target }}

  complete:
    name: Verify release
    if: ${{ always() }}
    needs: [validate, binaries, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish-latest: ${{ steps.verify.outputs.publish-latest }}
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify jobs, binary checksums and public multi-platform images
        id: verify
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/release.sh verify

  promote-latest:
    name: Promote latest images
    needs: [validate, complete]
    if: ${{ !cancelled() && needs.complete.result == 'success' && needs.complete.outputs.publish-latest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # All versions share this lock; image builds remain parallel.
      group: release-promote-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Recheck latest release after acquiring the lock
        id: eligible
        run: bash .github/scripts/release.sh latest-eligible
      - name: Set up Docker Buildx
        if: steps.eligible.outputs.publish-latest == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: steps.eligible.outputs.publish-latest == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified images to latest
        if: steps.eligible.outputs.publish-latest == 'true'
        id: promote
        run: |
          # Recheck immediately before promotion; another release may have appeared.
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "A newer release is latest; leaving latest image tags unchanged"
            exit 0
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for target in hub link portal; do
            image="ghcr.io/$owner/vine-$target"
            docker buildx imagetools create --tag "$image:latest" "$image:$RELEASE_TAG"
          done
          echo "promoted=true" >> "$GITHUB_OUTPUT"
      - name: Verify latest tags
        if: steps.promote.outputs.promoted == 'true'
        run: bash .github/scripts/release.sh verify-latest
