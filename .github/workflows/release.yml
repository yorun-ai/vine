name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build and publish
        required: true
        type: string
      images-only:
        description: Publish only images, preserving existing release assets
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      publish-latest: ${{ steps.release.outputs.publish-latest }}
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate release tag
        id: release
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use the v<major>.<minor>.<patch> format"
            exit 1
          fi

          git tag --points-at HEAD --list "$RELEASE_TAG" | grep -Fx "$RELEASE_TAG"
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease)"
          if [[ "$(jq -r .isDraft <<< "$release")" == true ]]; then
            echo "Release must be published before building its assets"
            exit 1
          fi

          # Rebuilding an older release or a prerelease must not replace latest.
          publish_latest=false
          if [[ "$(jq -r .isPrerelease <<< "$release")" == false ]]; then
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
              publish_latest=true
            fi
          fi

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish-latest=$publish_latest" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate changelog release
        run: |
          version="${RELEASE_TAG#v}"
          prefix="## [$version] - "
          release_heading="$(grep -F "$prefix" CHANGELOG.md || true)"
          release_date="${release_heading#"$prefix"}"
          if [[ "$release_heading" != "$prefix$release_date" ||
                ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "CHANGELOG.md must contain a dated [$version] release heading"
            exit 1
          fi

  binaries:
    name: Release binaries
    needs: validate
    if: ${{ !inputs.images-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build archives
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          ldflags="-s -w -X go.yorun.ai/vine/buildinfo.ldModuleVersion=$RELEASE_TAG"
          mkdir -p dist

          for target in \
            darwin/amd64 \
            darwin/arm64 \
            linux/amd64 \
            linux/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="vine_${version}_${goos}_${goarch}"
            stage="dist/$archive"

            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              GOMODCACHE="$RUNNER_TEMP/go-mod" \
              go build -trimpath -ldflags "$ldflags" \
                -o "$stage/vine" ./cmd/vine
            go version -m "$stage/vine" | awk '
              $1 == "mod" && $2 == "go.yorun.ai/vine" { found = 1 }
              END { exit !found }
            '
            cp LICENSE README.md THIRD_PARTY_LICENSES.txt "$stage/"
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          done

          dist/vine_${version}_linux_amd64/vine version --json |
            grep -F "\"version\":\"$RELEASE_TAG\""

      - name: Create checksums
        run: |
          cd dist
          sha256sum vine_*.tar.gz > checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/vine_*.tar.gz \
            dist/checksums.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  images:
    name: Publish ${{ matrix.target }} image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [hub, link, portal]
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Git-context metadata needs the tag refs, even when checking out a SHA.
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          # A manual rebuild runs from a branch, but metadata must use the release commit.
          context: git
          images: ghcr.io/${{ github.repository_owner }}/vine-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.publish-latest == 'true' }}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=vine-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=vine-${{ matrix.target }}
