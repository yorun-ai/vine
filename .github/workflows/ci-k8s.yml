name: Kubernetes manifests

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
      - name: Install manifest tools
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-bin"
          GOBIN="$RUNNER_TEMP/k8s-bin" GOWORK=off go install github.com/mikefarah/yq/v4@v4.53.6
          GOBIN="$RUNNER_TEMP/k8s-bin" GOWORK=off go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          echo "$RUNNER_TEMP/k8s-bin" >> "$GITHUB_PATH"
      - name: Validate manifests
        run: bash test/k8s.sh
